[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "elan1-govern"
version = "0.1.0"
description = "Python SDK for Elan1 Govern: check an AI agent's tool calls against your rules, then record what happened."
readme = "README.md"
requires-python = ">=3.9"
# Standard library only. Do not add runtime dependencies (see DECISIONS.md).
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
elan1_govern = ["py.typed"]
