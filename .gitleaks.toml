# gitleaks: default rules, plus documented exceptions (see SECURITY.md, "Accepted findings").
[extend]
useDefault = true

[allowlist]
description = "Dev-only sample secrets in .env.example (refused when APP_ENV=production), and public signing-key fingerprints shown in docs."
paths = ['''^\.env\.example$''']
# Fingerprints identify PUBLIC keys (first 16 hex of SHA-256 of the public key); auditors are meant to see them.
# Made-up Slack/WhatsApp credentials in test files of one commit, since replaced (SECURITY.md, "Accepted findings").
commits = ['''d7ae6b1ab0095ba98a9d474d475db049f297016a''', '''7fa4ede1c838bab1e56257b658692ba3b2dd60c3''']
regexTarget = "line"
# key_spec names an AWS KMS key type (a public constant), not a key.
regexes = ['''key fingerprint: [0-9a-f]{16}''', '''signing keys: [0-9a-f]{16}''', '''key_spec: ?['"]ECC_NIST_EDWARDS25519['"]''']
