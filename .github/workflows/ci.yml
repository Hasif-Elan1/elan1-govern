name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: gate, POSTGRES_PASSWORD: gate, POSTGRES_DB: gate }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U gate" --health-interval 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.21
        ports: ["1025:1025", "8025:8025"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: cp .env.example .env
      - run: pnpm install --frozen-lockfile
      - run: psql postgresql://gate:gate@localhost:5432/gate -c "CREATE DATABASE gate_test"
      - run: pnpm run setup --ci
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter @gate/web build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report }

  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:audit
      - run: pipx install semgrep && pnpm security:semgrep
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks detect --no-banner --redact -v

  zap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait
      - run: node scripts/zap-baseline.mjs --docker
      - if: always()
        run: docker compose logs --tail 200
