packages:
  - apps/*
  - packages/*

# Supply-chain hardening
# Don't install versions published in the last 7 days (most malicious releases are caught within days).
minimumReleaseAge: 10080
# Refuse a dependency whose publish trust level drops (e.g. lost provenance) between versions.
trustPolicy: no-downgrade
# Transitive deps may only come from the registry, never git URLs or tarballs.
blockExoticSubdeps: true
# Only these packages may run install scripts.
onlyBuiltDependencies:
  - argon2
  - prisma
  - "@prisma/client"
  - "@prisma/engines"
  - esbuild
  - unrs-resolver
